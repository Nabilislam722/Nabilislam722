# Draws the contribution-graph snake in the HUD colours and publishes it to
# the `output` branch, which README.md reads from.
name: Generate snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff8a1e&color_dots=#11161d,#163352,#215b8f,#3f86cc,#7fc4ff
            dist/snake-light.svg?color_snake=#ff8a1e&color_dots=#ebedf0,#c2dcf5,#8bbcea,#5290cf,#2b5f99

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
